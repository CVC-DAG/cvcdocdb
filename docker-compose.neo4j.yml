# Local Neo4j instance for running the `slow` (Neo4j) test suite.
#
# Usage:
#   docker compose -f docker-compose.neo4j.yml up -d
#   pytest test/ -m slow
#   docker compose -f docker-compose.neo4j.yml down
#
# Credentials match the defaults in .env.example / test/test_neo4j_real.py.
services:
  neo4j:
    image: neo4j:5-community
    container_name: cvcdocdb-neo4j-test
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      NEO4J_AUTH: neo4j/neo4j2026
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - cvcdocdb-neo4j-test-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  cvcdocdb-neo4j-test-data:
