name: Tests

on:
  push:
    branches: [develop, main, major_release]
  pull_request:
    branches: [develop, main, major_release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/testpassword123
        ports:
          - 7687:7687
          - 7474:7474
      memgraph:
        image: memgraph/memgraph:3.13.1
        env:
          MEMGRAPH_USER: memgraph
          MEMGRAPH_PASSWORD: testpassword123
      FUSEKI_URL: http://localhost:3030/ds
        ports:
          - 7688:7687

    env:
      # Consumed by test/conftest.py: since a real server already answers
      # here, its own testcontainers-based auto-start is skipped and every
      # 'slow'-marked test runs for real instead of self-skipping.
      NEO4J_DEV_URL: bolt://localhost:7687
      NEO4J_DEV_USER: neo4j
      NEO4J_DEV_PASSWORD: testpassword123
      NEO4J_DEV_DATABASE: neo4j
      MEMGRAPH_URL: bolt://localhost:7688
      MEMGRAPH_USER: memgraph
      MEMGRAPH_PASSWORD: testpassword123

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install -r requirements-test.txt

      - name: Wait for Neo4j to accept Bolt connections
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/localhost/7687) >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "Neo4j did not become reachable in time" >&2
          exit 1

      - name: Wait for Memgraph to accept Bolt connections
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/localhost/7688) >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "Memgraph did not become reachable in time" >&2
          exit 1

      - name: Start Apache Jena Fuseki
        # Not a service container: Fuseki needs its own command line (a clean
        # TDB2 dataset /ds with query + update), which services can't set.
        run: |
          docker run -d --name fuseki -p 3030:3030 -e FUSEKI_BASE=/tmp/base \
            -w /jena-fuseki --entrypoint sh secoresearch/fuseki:6.2.0 -c \
            "mkdir -p /tmp/db /tmp/base && exec java -cp '*:/javalibs/*' org.apache.jena.fuseki.main.cmds.FusekiServerCmd --tdb2 --loc /tmp/db --update /ds"
          for i in $(seq 1 60); do
            curl -sf -o /dev/null "$FUSEKI_URL/query?query=ASK%7B%7D" && exit 0
            sleep 2
          done
          docker logs fuseki
          echo "Fuseki did not become reachable in time" >&2
          exit 1

      - name: Run test suite (unit + integration + slow)
        run: |
          # "release" tests self-skip unless CVCDOCDB_RUN_RELEASE_TESTS=1
          # is set (see test/conftest.py and test/README.md) — they're
          # expensive cross-backend comparisons meant for a pre-publish
          # gate, not every push/PR.
          pytest test/ -v
