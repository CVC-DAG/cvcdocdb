# This workflow will upload a Python Package to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published, prereleased]

permissions:
  contents: read

jobs:
  release-tests:
    # Gate: a broken release must never reach PyPI. Runs the full suite,
    # including the expensive "release"-marked cross-backend migration +
    # schema codegen comparisons (see test/README.md) that are otherwise
    # skipped on every regular push/PR (see test.yml).
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/testpassword123
        ports:
          - 7687:7687
          - 7474:7474

    env:
      NEO4J_DEV_URL: bolt://localhost:7687
      NEO4J_DEV_USER: neo4j
      NEO4J_DEV_PASSWORD: testpassword123
      NEO4J_DEV_DATABASE: neo4j
      CVCDOCDB_RUN_RELEASE_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install -r requirements-test.txt

      - name: Wait for Neo4j to accept Bolt connections
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/localhost/7687) >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "Neo4j did not become reachable in time" >&2
          exit 1

      - name: Run full test suite, including release-only tests
        run: pytest test/ -v

  release-build:
    runs-on: ubuntu-latest
    needs:
      - release-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build release distributions
        run: |
          # NOTE: put your own distribution build steps here.
          python -m pip install build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  # testpypi-publish: skipped — publish to TestPyPI when needed
  # testpypi:
  #   if: false
  #   runs-on: ubuntu-latest
  #   needs: [release-build]
  #   permissions:
  #     id-token: write
  #   environment:
  #     name: testpypi
  #   steps:
  #     - name: Retrieve release distributions
  #       uses: actions/download-artifact@v4
  #       with:
  #         name: release-dists
  #         path: dist/
  #     - name: Publish release distributions to TestPyPI
  #       uses: pypa/gh-action-pypi-publish@release/v1
  #       with:
  #         packages-dir: dist/
  #         repository-url: https://test.pypi.org/legacy/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    # For more information, see: https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: pypi
      # OPTIONAL: uncomment and update to include your PyPI project URL in the deployment status:
      # url: https://pypi.org/p/YOURPROJECT
      #
      # ALTERNATIVE: if your GitHub Release name is the PyPI project version string
      # ALTERNATIVE: exactly, uncomment the following line instead:
      # url: https://pypi.org/project/YOURPROJECT/${{ github.event.release.name }}

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
